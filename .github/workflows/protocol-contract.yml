name: protocol-contract

# 本仓库最关键的一道 CI：协议漂移 + 安全基线 + 端到端契约。
# app-server 被官方标记为实验性，字段随时可能变；这三道闸门保证变化被及时发现而非静默破坏 UI。

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 03:00 UTC 主动检查上游是否有新版 codex 发布（版本漂移）
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: 安装锁定依赖
        run: npm ci

      # workflow 自身是否有效。无效文件**不会**失败在任何 job 上——
      # 它创建一次 0 job 的 run 就结束，看起来像「CI 还没跑」。见 §3.25。
      - name: 校验 workflow 自身有效
        run: bash scripts/verify-workflow.sh

      # 平台门控死代码：本地（macOS）全绿、只在 Linux job 上失败的那类问题。
      # 起因见 docs/协议勘误与修正.md §3.29：applescript_quote 只被 macOS
      # 分支调用却没加 cfg，Linux 上成为死代码，clippy -D warnings 变错。
      # 交叉编译覆盖不到它（kcode-desktop 需要 GTK，交叉不了），故用静态检查。
      - name: 平台门控检查（防 Linux 死代码）
        run: bash scripts/check-platform-gating.sh

      - name: 校验 codex 版本与哈希（安全基线 + 可复现）
        run: bash scripts/verify-codex-version.sh

      # 各平台的锁定哈希需要**在该平台上**才能算出（二进制不同、哈希必然不同）。
      # 开发机是 macOS，无法算出 Linux 的哈希——所以在这里把它打出来并写入
      # **job summary**（匿名可读，不需要 admin 权限下载日志），供回填。
      # **不猜、不编造**：上面那步在本平台未记录时会明确提示。
      - name: 打印本平台 codex 哈希（用于回填 codex.lock.json）
        run: |
          bash scripts/verify-codex-version.sh --print-hash | tee /tmp/hash.txt
          {
            echo "### 本平台 codex 二进制"
            echo '```'
            grep -E '^(platform|version|sha256)=' /tmp/hash.txt || echo "（未取到）"
            echo '```'
            echo "若上面的平台不在 \`codex.lock.json\` 的 \`platforms\` 里，请回填后提交。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 检测协议漂移（schema + TS 绑定）
        run: bash scripts/gen-schema.sh --check

      - name: 协议事实清单是否需重新生成
        run: |
          node scripts/protocol-facts.mjs
          if ! git diff --quiet docs/protocol-facts.md; then
            echo "::error::docs/protocol-facts.md 与当前 schema 不一致，请运行 node scripts/protocol-facts.mjs 并提交"
            git diff --stat docs/protocol-facts.md
            exit 1
          fi

      - name: 端到端契约测试（离线、零凭据、本地 mock provider）
        run: node scripts/contract-test.mjs

  rust:
    runs-on: ubuntu-latest
    # `secrets` **不能**出现在任何 `if:` 表达式里：GitHub 会因此判定
    # **整个 workflow 文件无效**，所有 job 一个都不跑（本项目为此空跑了
    # 18 次推送才被发现，见 docs/协议勘误与修正.md §3.25）。
    # 因此这里只在 job 级 env 里算出「有没有凭据」的布尔标记，
    # 具体密钥值仍只挂在单个步骤上——不给该 job 的每个步骤都塞一遍密钥。
    env:
      HAS_MODEL_KEY: ${{ secrets.KCODE_MODEL_API_KEY != '' }}
      # 日志必须是**可被 grep 的确定形态**。cargo 在 CI 上会输出 ANSI 颜色码
      # （实测 `\x1b[1m\x1b[91merror…`），而所有按 `^error` 写的诊断判据都
      # 匹配不上它——rust job 因此连续多轮把「编译期错误」误报成「没有 error 行」，
      # 一路推断到资源/OOM 的错误方向（见 §3.32）。这里显式关掉颜色，
      # 让日志形态与本地一致；诊断脚本另有一层无条件剥色，两层都不依赖对方。
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      # Rust 集成测试需要真实的 codex 二进制
      - name: 安装锁定依赖（含 codex 平台二进制）
        run: npm ci

      # **bubblewrap 是集成测试的硬前提**（根因，见 §3.29）。
      #
      # Linux 上 workspace-write 沙箱的命令执行依赖它。缺少时 app-server 会
      # 通过 `configWarning` 明说（**根因的直接证据**，此前一直被忽略）：
      #
      #   1. 未装 bwrap：
      #      "Codex could not find bubblewrap on PATH. Install bubblewrap with
      #       your OS package manager. ... Codex will use the bundled bubblewrap
      #       in the meantime."（而它并没有真的用成 bundled 的那个）
      #   2. 装了 bwrap 但 userns 受限：
      #      "Codex's Linux sandbox uses bubblewrap and needs access to create
      #       user namespaces."
      #
      # 第二条正是 Ubuntu 23.10+ 的默认策略：AppArmor 限制非特权 user
      # namespace（防提权），而 bubblewrap 靠 userns 做隔离。GitHub 的
      # ubuntu-latest 就在此列。
      #
      # 我一度因 `use_linux_sandbox_bwrap` 特性是 **removed** 就排除了 bwrap，
      # 那是**反了的推理**：开关被移除恰恰意味着 bwrap 是**默认且必需**的
      # 前提——只有可选项才需要开关。
      #
      # 放开 userns 不是「为测试放宽条件」：这是容器/CI 里运行沙箱工具的标准
      # 前提（Docker 亦默认放开），且沙箱本身仍在工作——它正是被验证的对象。
      - name: 安装并启用 bubblewrap（Linux 沙箱的命令执行前提）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          echo "bwrap: $(command -v bwrap) ($(bwrap --version))"

          # 自检：非特权 userns 是否可用（两条路径因发行版而异）
          echo "--- userns 前提 ---"
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo "apparmor_restrict_unprivileged_userns: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
          else
            echo "apparmor_restrict_unprivileged_userns: （无此文件）"
          fi
          if [[ -f /proc/sys/kernel/unprivileged_userns_clone ]]; then
            echo "unprivileged_userns_clone: $(cat /proc/sys/kernel/unprivileged_userns_clone)"
          else
            echo "unprivileged_userns_clone: （无此文件）"
          fi

          # 放开限制（Ubuntu 23.10+ 需要前一条；老内核需要后一条）
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 2>/dev/null || true

          # 实测 bwrap 是否真的能建 userns —— 这是决定性判据，
          # 不看参数、直接看它能不能跑起来
          echo "--- bwrap 实测 ---"
          if bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / /bin/true 2>/tmp/bwrap-err; then
            echo "✅ bwrap 可用（能创建 user namespace）"
          else
            echo "❌ bwrap 不可用：$(head -3 /tmp/bwrap-err | tr '\n' ' ')"
            echo "   （沙箱将无法执行命令，集成测试会失败在「未找到命令 Item」）"
          fi

      # Tauri 在 Linux 上编译需要 GTK / WebKit 的开发库。
      # 缺它们时 `glib-sys` 的 build script 直接失败，而报错是
      # "failed to run custom build command for glib-sys" —— 从这句
      # 看不出缺的是哪个 apt 包，所以这里显式装上并注明来源。
      # 这是 Tauri 官方 prerequisites（Linux 一节的等价物）。
      - name: 安装 Tauri 的 Linux 系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 单元测试。用 `--no-fail-fast` 让所有 crate 都跑完（默认遇到第一个
      # 失败就停，只能看到一个 crate 的问题）；`tee` 落盘一份日志，
      # 供下一步在**注解面板**里点名失败用例。
      #
      # 为什么要点名到注解：CI 的完整日志需要仓库 admin 权限才能下载
      # （本项目为公开仓库、开发机无 admin），而注解面板是匿名可读的。
      # 只看到「测试失败」而看不到是哪一个，等于要再跑一轮才能定位——
      # 勘误 §3.23 的教训：不可行动的失败报告等于没有报告。
      # **必须 set -o pipefail**：`cmd | tee log` 的退出码是 tee 的（0），
      # 于是测试失败也报成功——曾因此静默放过 Linux 上的单元测试失败
      # （`pick_uses_bundle_when_path_lacks_cli` 在 Linux 上因 BUNDLE_PATHS
      # 为空而失败，CI 却显示 OK）。与 §3.25 的 workflow 失效同类：
      # **绿不代表真的跑通了**。
      #
      # # 为什么拆成两步而不是 `--workspace`
      #
      # 原先一条命令跑全部 lib 测试，失败时**无法归因到哪个 crate**：
      # kcode-desktop 要编译整棵 tauri 依赖树（tao/tauri-codegen/…），
      # 而那正是最可能出问题（也最耗时）的一段。失败信息里只有
      # 「全部单元测试」这一个名字，排查必须再跑一轮。拆开后步骤名即定位。
      #
      # ── 以下是为「日志停在 Compiling 行」那条线索加的诊断步骤 ──
      #
      # 资源基线：CPU / 内存 / 磁盘，外加颜色相关环境探针。
      #
      # # 起因与结局（务必读完，否则会重走弯路）
      #
      # 这个步骤是**为验证一个推断**加的：rust job 曾连续多轮失败在「日志停在
      # Compiling 行、没有任何 error 行」，据此推断是资源/超时（OOM、磁盘耗尽）。
      #
      # **该推断已被否证**（2026-09-24）：加基线后那轮的内存 avail 14Gi、
      # 磁盘可用 83G，毫无压力；真正的原因藏在日志中部，被 cargo 的 ANSI
      # 颜色码埋住（`^error` 匹配不上 `\x1b[1m\x1b[91merror…`）——
      # 是 `binaries/` 目录缺失导致 kcode-desktop 的 build script 失败。
      # 完整复盘见 docs/协议勘误与修正.md §3.32。
      #
      # # 那为什么还留着它
      #
      # 因为它便宜（一行输出）且是**通用**的：任何「进程静默消失」的失败
      # 都要先排除资源因素，而这一步让排除只需读一行，不必再跑一轮。
      # 但请记住：**它不是用来确认资源问题的，是用来快速否证它的**。
      #
      # # 探针为什么也在这里
      #
      # 颜色码那次教训的根因是「诊断通道自己污染了证据」——日志里有错误，
      # 但诊断看不见。所以这里顺带把决定「cargo 上不上色」的环境变量打出来
      # （用 ::notice:: 发注解，成功时也可见），避免下次再靠猜。
      - name: 资源基线（判断失败是代码问题还是环境问题）
        run: |
          echo "── CPU ──"; nproc
          echo "── 内存 ──"; free -h
          echo "── 磁盘 ──"; df -h / /tmp 2>/dev/null || df -h /
          echo "── 工作区可用空间 ──"; df -h . | tail -1
          echo "── 颜色相关环境变量 ──"
          env | grep -iE '^(CARGO_TERM_COLOR|CLICOLOR|CLICOLOR_FORCE|NO_COLOR|TERM|COLORTERM)=' || echo "（均未设置）"

          line=$(printf '内存 total %s / avail %s ／ 磁盘 / 可用 %s ／ 工作区可用 %s' \
            "$(free -h | awk '/^Mem:/{print $2}')" \
            "$(free -h | awk '/^Mem:/{print $7}')" \
            "$(df -h / | awk 'NR==2{print $4}')" \
            "$(df -h . | awk 'NR==2{print $4}')")
          echo "$line" > /tmp/resource-baseline.txt
          echo "资源基线：$line"   # 日志里也留一份
          echo "资源基线：$line" >> "$GITHUB_STEP_SUMMARY"

          # 探针走 ::notice:: 注解（成功失败都可见，见上方说明）。
          # grep 无匹配时退出码为 1，`|| true` 兜住 `bash -e`。
          color_env=$(env | grep -iE '^(CARGO_TERM_COLOR|CLICOLOR|CLICOLOR_FORCE|NO_COLOR|TERM|COLORTERM)=' | tr '\n' ' ' || true)
          echo "::notice::颜色环境：${color_env:-（均未设置）}"

      - name: 单元测试 · 核心三 crate（纯逻辑，无外部依赖）
        run: |
          set -o pipefail
          cargo test -p kcode-bridge -p kcode-domain -p kcode-app --lib --no-fail-fast \
            2>&1 | tee /tmp/rust-tests.log

      - name: 单元测试 · kcode-desktop（含模拟器解析与能力位）
        run: |
          set -o pipefail
          cargo test -p kcode-desktop --lib --no-fail-fast 2>&1 | tee -a /tmp/rust-tests.log

      # 失败诊断分两路：
      # - **job summary 放全文**（无配额限制，但未登录访问者看不到）
      # - **注解放最关键的几行**（匿名可读，但每个 check-run 有上限，实测 23 条）
      #
      # 分两路是被配额逼出来的：早先诊断步骤一口气输出 20+ 条注解，把上限
      # 吃满，真正关键的失败原因反而被挤掉——表现为「CI 红了但看不到为什么」。
      - name: 失败摘要（仅失败时执行）
        if: failure()
        run: |
          LOG=/tmp/rust-tests.log
          if [[ ! -f "$LOG" ]]; then
            echo "::error::日志文件缺失：$LOG（步骤在写入前就失败了）"
            exit 0
          fi
          # 资源数字放最前：注解配额从前往后吃，超出的被静默丢弃（§3.29 踩过）。
          # 它的角色是**快速排除**资源因素（一行读完），而不是「唯一判据」——
          # 定性的判据与根因由下面的摘要脚本给出（§3.32：那一轮资源其实很充裕，
          # 真正的错误是被 ANSI 颜色码埋掉的）。基线与现场都给：只看其中一个会误判。
          base=$(cat /tmp/resource-baseline.txt 2>/dev/null || echo '未采集（基线步骤未执行）')
          printf '::error::资源：%s ／ 失败时 mem avail %s, disk / avail %s\n' \
            "$base" \
            "$(free -h | awk '/^Mem:/{print $7}')" \
            "$(df -h / | awk 'NR==2{print $4}')"
          # 全文进 summary（前 80 行足够覆盖编译错误）
          {
            echo '### 单元测试失败详情（前 80 行）'
            echo '```'
            head -80 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 注解放摘要脚本挑出的关键行
          bash scripts/ci-summarize-failures.sh "$LOG" | head -8

      # 日志上传为 artifact，保留 7 天。
      #
      # **注意：这不是一条「匿名可读」的通道。** 上一轮我按推断写下「artifact
      # 匿名可下载」，2026-09-24 实测否证：API 取是 401，走网页重定向取是 404
      # （§3.31）。它只能靠带登录态的浏览器会话用。因此**凡决定性信息仍必须
      # 走注解**——三条通道里只有注解真的通，而它配额最小（实测 23 条）。
      # 上传保留的理由：拿到登录态的人（或仓库 admin）仍可取全文。
      - name: 上传测试日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-logs
          path: |
            /tmp/rust-tests.log
            /tmp/rust-integration.log
          if-no-files-found: warn
          retention-days: 7

      - name: 集成测试（真实 app-server 进程 + 本地 mock 模型）
        run: |
          set -o pipefail
          {
            cargo test -p kcode-bridge --test contract --test approval_semantics --no-fail-fast
            cargo test -p kcode-domain --test integration --no-fail-fast
            cargo test -p kcode-app --test acceptance --no-fail-fast
          } 2>&1 | tee /tmp/rust-integration.log

      - name: 集成测试失败摘要（仅失败时执行）
        if: failure()
        run: |
          # 更早的步骤失败时，集成测试**根本没跑**，而 `if: failure()` 仍会
          # 触发这一步——此时摘要脚本会报「找不到日志文件」，那是一条**假信号**：
          # 它占掉一条注解配额，而字面意思像是集成测试自己坏了（2026-09-23
          # 那轮就有人这么误读过，见 §3.31）。所以先确认日志存在。
          if [[ ! -f /tmp/rust-integration.log ]]; then
            echo "集成测试未执行（更早的步骤已失败，日志未生成）——跳过摘要" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bash scripts/ci-summarize-failures.sh /tmp/rust-integration.log

      # 沙箱前提自检。集成测试失败的现场是「模型发出了命令调用、轮次正常收尾，
      # 但命令 Item 根本没产生」——这指向**命令执行通道本身**而不是命令语法
      # （连 `echo hello` 都不产生 Item）。Linux 上 workspace-write 沙箱依赖
      # 内核/工具支持，所以把前提打出来，让「沙箱不可用」这个假设可被证实或排除，
      # 而不是继续猜（见 docs/协议勘误与修正.md §3.27）。
      #
      # **同时写注解**（::error:: 之外的普通行不会进注解，所以这里显式加前缀）：
      # job summary 对未登录访问者不渲染，而注解面板匿名可读——本项目的开发
      # 环境没有 admin 权限，注解是唯一稳定的读取通道。
      # 集成测试失败时的诊断。**注解有数量上限（实测 23 条/check-run）**，
      # 超出部分会被静默丢弃——早先这一步输出了 20+ 行（含整个 doctor），
      # 结果最关键的 probe-exec 结论被截掉，等于白跑一轮。
      # 所以这里刻意只输出**少数几条决定性信息**，其余进 job summary。
      - name: 集成测试失败诊断（仅失败时执行）
        if: failure()
        run: |
          # `set +e`：诊断命令任何一条非零退出都不该终止脚本
          # （踩过：`set -e` 下 `out=$(cmd)` 遇非零立即退出，后面探针没跑）
          set +e

          # 同前一步：集成测试没跑时这一步不该跑。否则它会用 8+ 条注解汇报
          # 「沙箱正常」，而失败原因与沙箱无关——2026-09-23 那轮的 20 条注解里
          # 有近一半是这么被吃掉的（真正的失败点在 desktop 单元测试那一步，
          # 探针结论对它没有任何解释力）。见 §3.31。
          if [[ ! -f /tmp/rust-integration.log ]]; then
            echo "集成测试未执行——跳过沙箱探针（与本次失败无关）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 资源判据排最前（配额从前往后吃）：格式与「失败摘要」那步一致
          base=$(cat /tmp/resource-baseline.txt 2>/dev/null || echo '未采集（基线步骤未执行）')
          printf '::error::资源：%s ／ 失败时 mem avail %s, disk / avail %s\n' \
            "$base" \
            "$(free -h | awk '/^Mem:/{print $7}')" \
            "$(df -h / | awk 'NR==2{print $4}')"

          BIN=$(find node_modules/@openai -path '*vendor*/bin/codex' -type f 2>/dev/null | head -1)

          {
            echo '### 诊断（完整输出）'
            echo '```'
            echo "kernel: $(uname -r)"
            echo "zsh: $(command -v zsh || echo '未安装')"
            echo "bash: $(command -v bash || echo '未安装')"
            echo "bwrap: $(command -v bwrap || echo '未安装')"
            echo "landlock: $(grep -c landlock /sys/kernel/security/lsm 2>/dev/null || echo '?')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 决定性判据：在同一条链路上跑一次真实命令，看有没有 commandExecution Item
          PROBE_OUT=$(cd "$GITHUB_WORKSPACE" && node scripts/probe-exec.mjs "$BIN" 2>&1)
          echo "$PROBE_OUT" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::zsh=$(command -v zsh || echo 未安装) bash=$(command -v bash)"
          echo "$PROBE_OUT" | grep -E "^(✅|❌|   exitCode|   与命令相关|   含义|收到方法)" | head -4 | while IFS= read -r line; do
            echo "::error::probe-exec $line"
          done
          # 命令形式本身也是证据（codex 用什么 shell 执行）
          echo "$PROBE_OUT" | grep -oE "command=/[^ ]+ -lc" | head -1 | while IFS= read -r c; do
            echo "::error::probe-exec 执行形式 $c"
          done
          # 告警内容：CI 上多出的 configWarning 可能直接指出根因
          echo "$PROBE_OUT" | grep -A2 "告警内容" | head -3 | while IFS= read -r line; do
            [[ -n "$line" ]] && echo "::error::probe-exec $line"
          done

      - name: 静态检查
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 测试数字的单一来源：README 的统计区间与 docs/test-stats.md 都由本脚本
      # **实跑**统计（Rust + 前端 + 三个契约脚本），漂移即失败——与
      # protocol-facts.md 同一套做法，因为「可验证」正是本项目的主张。
      # 放在 rust job 的理由：这是唯一同时具备 cargo、node 与 codex 二进制的地方。
      - name: 测试数字漂移检查
        run: node scripts/test-stats.mjs --check

      # 出站连接抓取：验证 SECURITY.md 的零静默外发承诺。
      # 允许 OpenAI CDN 段（上游 codex 行为，已在 SECURITY.md 披露），
      # 任何其他连接都会使本步骤失败。
      - name: 出站连接验证
        run: bash scripts/verify-no-egress.sh --duration 6

      # Tauri 2 默认不授予权限，缺失时构建仍然成功但 invoke/listen 会
      # 在运行时被静默拒绝——这类缺陷穿不过 IPC 层，全部 Rust 测试都测不到。
      - name: Tauri capability 校验
        run: bash scripts/verify-tauri-capabilities.sh

      # 沙箱边界：需要真实模型凭据（CI 中通过 secrets 注入）。
      # 无凭据时脚本退出码 3，此处允许跳过而非失败。
      # 判断依据是 job 级 env 里的布尔标记——`if:` 里不能直接写 secrets。
      - name: 沙箱边界验收（需模型凭据）
        if: env.HAS_MODEL_KEY == 'true'
        env:
          KCODE_MODEL_BASE_URL: ${{ secrets.KCODE_MODEL_BASE_URL }}
          KCODE_MODEL_API_KEY: ${{ secrets.KCODE_MODEL_API_KEY }}
          KCODE_MODEL_NAME: ${{ secrets.KCODE_MODEL_NAME }}
        run: bash scripts/verify-sandbox-boundary.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 前端状态推导最容易出细微错误（例如把 declined 显示成 completed），
      # 且这类错误只在特定事件顺序下才显现，必须单测覆盖。
      - name: 前端单元测试
        run: npx vitest run

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 构建检查
        run: npx vite build
